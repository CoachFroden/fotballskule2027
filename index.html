<style>
.missing-choice{position:fixed;inset:0;z-index:99999;background:rgba(4,18,37,.7);display:flex;align-items:center;justify-content:center;padding:18px}
.missing-choice-card{box-sizing:border-box;width:min(100%,370px);background:#f7fbff;color:#123252;border-radius:17px;padding:22px;box-shadow:0 16px 45px rgba(0,0,0,.35)}
.missing-choice-card>strong{display:block;font-size:21px;color:#123252}
.missing-choice-card p{margin:9px 0 13px;font-weight:700;color:#123252}
.missing-choice-card small{display:block;margin-bottom:12px;color:#365672}
.missing-choice-options{display:grid;gap:9px}
.missing-choice-options button{background:#195582!important;color:white!important;border:0!important;border-radius:10px!important;min-height:46px;font-weight:750;cursor:pointer}
.missing-choice-options button:last-child{background:#176c54!important}
.missing-choice-cancel{display:block;margin:12px auto 0;background:transparent!important;border:0!important;color:#284d70!important;padding:10px 18px;font-weight:700;cursor:pointer}
</style>
<style>
.responsible-participant-page{background:#f4f8fc!important;color:#173959!important;padding:12px!important;border-radius:13px!important}
.responsible-participant-search{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.responsible-participant-search input{flex:1;min-width:0;min-height:40px;padding:8px 11px;border:1px solid #9eb9d2;border-radius:8px;background:#fff;color:#173959}
.responsible-participant-search span{font-size:11px;color:#496b85;white-space:nowrap}
.responsible-participant-item{background:#fff;border:1px solid #cfdeeb;border-radius:9px;margin-bottom:6px;color:#173959}
.responsible-participant-item summary{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:11px;cursor:pointer;list-style:none}
.responsible-participant-item summary::-webkit-details-marker{display:none}
.responsible-participant-item summary strong{font-size:13px;min-width:0;overflow-wrap:anywhere;color:#123556}
.responsible-participant-markers{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.responsible-participant-markers small{font-size:10px;color:#4a6a85;white-space:nowrap}
.responsible-participant-alert{font-size:10px;font-weight:750;padding:3px 5px;border-radius:5px;white-space:nowrap}
.responsible-participant-alert.red{background:#ffe4e4;color:#a21c1c}
.responsible-participant-alert.amber{background:#fff0cc;color:#815300}
.responsible-participant-info{border-top:1px solid #dce6ef;background:#f8fbff;padding:10px 12px;color:#173959;font-size:13px;overflow-wrap:anywhere}
.responsible-participant-info p{margin:5px 0;color:#173959}
.responsible-participant-info a{color:#1162a5;font-weight:750}
.responsible-participant-privacy{font-size:11px;color:#55708a;margin:12px 0 0}
</style>
